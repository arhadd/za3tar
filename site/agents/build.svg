<svg viewBox="0 0 600 680" xmlns="http://www.w3.org/2000/svg">
  <!-- right arm holding a rolled plan -->
  <path d="M 440 380 C 478 360 500 330 506 290" fill="none" stroke="#FF4000" stroke-width="38" stroke-linecap="round"/>
  <path d="M 440 380 C 478 360 500 330 506 290" fill="none" stroke="#FFE9A8" stroke-width="30" stroke-linecap="round"/>
  <g transform="rotate(-28 520 250)">
    <rect x="470" y="226" width="120" height="44" rx="22" fill="#A9CBF1" stroke="#5B4CFF" stroke-width="4.5"/>
    <ellipse cx="590" cy="248" rx="12" ry="22" fill="#FFFDF6" stroke="#5B4CFF" stroke-width="4.5"/>
    <path d="M 492 240 l 70 0 M 492 256 l 50 0" stroke="#5B4CFF" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- left arm with a clipboard of ticks -->
  <path d="M 160 390 C 120 420 105 460 110 500" fill="none" stroke="#FF4000" stroke-width="38" stroke-linecap="round"/>
  <path d="M 160 390 C 120 420 105 460 110 500" fill="none" stroke="#FFE9A8" stroke-width="30" stroke-linecap="round"/>
  <rect x="62" y="470" width="78" height="100" rx="10" fill="#FFFDF6" stroke="#FF4000" stroke-width="4" transform="rotate(-8 100 520)"/>
  <path d="M 78 500 l 8 9 l 16 -18 M 80 534 l 8 9 l 16 -18" fill="none" stroke="#5B4CFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-8 100 520)"/>
  <!-- feet (boots) -->
  <path d="M 196 612 h 90 c 6 0 10 30 0 36 h -96 c -10 0 -10 -36 6 -36 Z" fill="#7A3B1E" stroke="#FF4000" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M 314 612 h 90 c 16 0 16 36 6 36 h -96 c -10 -6 -6 -36 0 -36 Z" fill="#7A3B1E" stroke="#FF4000" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- body -->
  <path d="M 300 160 C 420 156 478 250 480 385 C 482 540 420 618 300 618 C 180 618 118 540 120 385 C 122 250 180 164 300 160 Z" fill="#FFE9A8" stroke="#FF4000" stroke-width="5" stroke-linejoin="round"/>
  <!-- safety vest with reflective stripes -->
  <path d="M 188 380 C 230 350 370 350 412 380 L 420 560 C 360 600 240 600 180 560 Z" fill="#FF8A3D" stroke="#FF4000" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M 262 362 L 300 470 L 338 362" fill="#FFE9A8" stroke="#FF4000" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 184 482 C 240 500 360 500 416 482 M 182 526 C 240 546 360 546 418 526" fill="none" stroke="#FFFDF6" stroke-width="12" stroke-linecap="round"/>
  <!-- hard hat -->
  <path d="M 176 176 C 180 70 420 70 424 176 Z" fill="#FFC23D" stroke="#FF4000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="146" y="168" width="308" height="30" rx="15" fill="#FFC23D" stroke="#FF4000" stroke-width="5"/>
  <path d="M 300 84 L 300 168" stroke="#FF4000" stroke-width="5"/>
  <path d="M 226 120 q 14 -26 40 -32" fill="none" stroke="#FFFDF6" stroke-width="8" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="264" cy="255" r="28" fill="#FFF3E3" stroke="#FF4000" stroke-width="4"/>
  <circle cx="332" cy="259" r="28" fill="#FFF3E3" stroke="#FF4000" stroke-width="4"/>
  <circle cx="270" cy="260" r="10" fill="#1A1A1A"/>
  <circle cx="338" cy="264" r="10" fill="#1A1A1A"/>
  <!-- smile and pencil behind the ear -->
  <path d="M 280 318 q 20 18 40 2" fill="none" stroke="#FF4000" stroke-width="4" stroke-linecap="round"/>
  <path d="M 444 210 l 34 -46" stroke="#5B4CFF" stroke-width="12" stroke-linecap="round"/>
  <path d="M 478 164 l 6 -10" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
</svg>
