<!doctype html>
<!-- Share card source for site/og.png (1200x630). Render: scripts/og/render.sh -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B1710;--paper:#F2EEE2;--ink-66:rgba(11,23,16,.66);--green:#6F7F5A;
  --sans:"Archivo",Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;position:relative}
.logo{position:absolute;left:80px;top:72px;display:flex;align-items:center;gap:12px;font-stretch:78%;font-weight:700;font-size:30px;letter-spacing:-.01em}
.logo img{width:34px;height:34px}
h1{position:absolute;left:80px;top:186px;width:730px;font-size:84px;font-stretch:88%;font-weight:800;letter-spacing:-.035em;line-height:.94}
h1 .w{display:block;font-family:var(--mono);font-weight:700;letter-spacing:-.03em;color:var(--green);font-size:.9em;line-height:1.08}
.mark{position:absolute;right:80px;top:170px;width:290px;height:290px}
.url{position:absolute;left:80px;bottom:72px;font-family:var(--mono);font-size:20px;letter-spacing:.08em;color:var(--ink-66)}
</style>
</head>
<body>
<div class="logo"><img src="../../site/brand/mark-mono.svg" alt="">za3tar</div>
<h1>We supercharge your team’s ability to <span class="w">work</span></h1>
<img class="mark" src="../../site/brand/mark-mono.svg" alt="">
<div class="url">ZA3TAR.AI</div>
</body>
</html>
