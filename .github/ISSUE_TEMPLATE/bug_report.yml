name: Bug report
description: Something in za3tar behaves wrong. Describe it without sharing private audio.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach real meeting audio, transcripts, or notes.**

        za3tar exists because those recordings are private. We do not want them,
        we will not ask for them, and an issue containing one will be deleted
        rather than triaged. Describe the *situation* instead — how many
        speakers, which language mix, which device, what you expected.

        If you can reproduce the problem with a throwaway recording of yourself
        reading nonsense, that is always safe to attach.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no real meeting audio, transcript, or notes.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did za3tar do, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a recording with…
        2. Stop it after…
        3. Open the transcript and…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: za3tar version
      description: From the app, or the release tag you installed.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "14.4"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Signed DMG from a GitHub release
        - Built from source
    validations:
      required: true
  - type: textarea
    id: audio-situation
    attributes:
      label: Audio situation
      description: >
        Only if the bug involves capture or transcription. How many speakers,
        which languages and dialects, mic or system audio or both, headphones
        or open room. Describe it — do not attach it.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Redact anything identifying before pasting. Never paste API keys.
      render: shell
